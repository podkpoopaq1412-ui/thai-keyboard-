name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/xml app/src/main/res/values app/src/main/java/com/example/longestkb
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LongestWordKeyboard"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.longestkb"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.longestkb"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".LongestWordIME"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.example.longestkb.MainActivity">
              <subtype
                  android:label="ไทย"
                  android:imeSubtypeLocale="th_TH"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">แป้นพิมพ์คำยาวสุด</string>
          </resources>
          EOF
          cat > app/src/main/java/com/example/longestkb/MainActivity.kt <<'EOF'
          package com.example.longestkb

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var enabledText: TextView
              private lateinit var selectedText: TextView
              private val imm get() = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (20 * resources.displayMetrics.density).toInt()
                  fun label(t: String, size: Float) = TextView(this).apply {
                      text = t; textSize = size; setPadding(0, pad / 2, 0, pad / 4)
                  }
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }
                  col.addView(label("แป้นพิมพ์คำยาวสุด", 24f))
                  enabledText = label("", 14f)
                  col.addView(enabledText)
                  col.addView(Button(this).apply {
                      text = "1. เปิดใช้งานแป้นพิมพ์"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)) }
                  })
                  selectedText = label("", 14f)
                  col.addView(selectedText)
                  col.addView(Button(this).apply {
                      text = "2. เลือกใช้แป้นพิมพ์นี้"
                      setOnClickListener { imm.showInputMethodPicker() }
                  })
                  col.addView(EditText(this).apply {
                      hint = "3. แตะที่นี่แล้วลองพิมพ์ ตม"; textSize = 18f
                  })
                  setContentView(col)
              }

              override fun onResume() { super.onResume(); refresh() }
              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus); if (hasFocus) refresh()
              }

              private fun refresh() {
                  val enabled = imm.enabledInputMethodList.any { it.packageName == packageName }
                  val current = Settings.Secure.getString(contentResolver, Settings.Secure.DEFAULT_INPUT_METHOD) ?: ""
                  enabledText.text = if (enabled) "✓ เปิดใช้งานแล้ว" else "ยังไม่ได้เปิดใช้งาน"
                  selectedText.text = if (current.startsWith("$packageName/")) "✓ กำลังใช้แป้นพิมพ์นี้" else "ยังไม่ได้เลือกใช้"
              }
          }
          EOF
          cat > app/src/main/java/com/example/longestkb/LongestWordIME.kt <<'EOF'
          package com.example.longestkb

          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView

          class LongestWordIME : InputMethodService() {
              private companion object {
                  val NORMAL = listOf("1234567890", "ๅ/-ภถุึคตจขช", "ๆไำพะัีรนยบล", "ฟหกดเ้่าสวง", "ผปแอิืทมใฝ")
                  val SHIFT = listOf("1234567890", "+๑๒๓๔ู฿๕๖๗๘๙", "๐\"ฎฑธํ๊ณฯญฐ,", "ฤฆฏโฌ็๋ษศซ.", "()ฉฮฺ์?ฒฬฦ")
                  val TAIL = Regex("[\\u0E00-\\u0E7F]+$")
                  val COMB = Regex("[\\u0E31\\u0E34-\\u0E3A\\u0E47-\\u0E4E]")
                  val BG = Color.parseColor("#1E2321")
                  val KEY = Color.parseColor("#353D39")
                  val KEY2 = Color.parseColor("#262C29")
                  val ACC = Color.parseColor("#5FC4A6")
              }

              @Volatile private var words: List<String> = emptyList()
              private var shift = false
              private var containsMode = true
              private var suppress = false
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var scroller: HorizontalScrollView
              private lateinit var bar: LinearLayout
              private lateinit var keyArea: LinearLayout

              override fun onCreate() {
                  super.onCreate()
                  // Load the whole word list once, longest words first.
                  Thread {
                      val set = HashSet<String>()
                      assets.open("words_th.txt").bufferedReader().useLines { lines ->
                          lines.forEach { l ->
                              val w = l.trim()
                              if (w.length > 1 && w.none { it.isWhitespace() }) set.add(w)
                          }
                      }
                      words = set.sortedByDescending { it.length }
                  }.start()
              }

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      setPadding(dp(4), dp(4), dp(4), dp(8))
                  }
                  bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      minimumHeight = dp(46)
                  }
                  scroller = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(bar)
                  }
                  keyArea = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(scroller)
                  root.addView(keyArea)
                  buildKeys()
                  showSuggestions()
                  return root
              }

              override fun onStartInputView(info: EditorInfo, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  val cls = info.inputType and InputType.TYPE_MASK_CLASS
                  val v = info.inputType and InputType.TYPE_MASK_VARIATION
                  suppress = cls != InputType.TYPE_CLASS_TEXT ||
                      v == InputType.TYPE_TEXT_VARIATION_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD ||
                      v == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD
                  showSuggestions()
              }

              override fun onUpdateSelection(
                  oldSelStart: Int, oldSelEnd: Int, newSelStart: Int, newSelEnd: Int,
                  candidatesStart: Int, candidatesEnd: Int
              ) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd)
                  showSuggestions()
              }

              // ---- suggestions: longest words containing the Thai letters just before the cursor ----
              private fun showSuggestions() {
                  if (!::bar.isInitialized) return
                  bar.removeAllViews()
                  bar.addView(chip(if (containsMode) "มีในคำ" else "ขึ้นต้น", true) {
                      containsMode = !containsMode; showSuggestions()
                  })
                  if (suppress) return
                  val before = currentInputConnection?.getTextBeforeCursor(30, 0)?.toString() ?: return
                  val buf = TAIL.find(before)?.value ?: return
                  var n = 0
                  for (w in words) {
                      if (w == buf) continue
                      val hit = if (containsMode) w.contains(buf) else w.startsWith(buf)
                      if (hit) {
                          bar.addView(chip(w, false) { pick(buf, w) })
                          if (++n >= 40) break
                      }
                  }
                  scroller.scrollTo(0, 0)
              }

              private fun pick(buf: String, word: String) {
                  currentInputConnection?.apply {
                      beginBatchEdit()
                      deleteSurroundingText(buf.length, 0)
                      commitText("$word ", 1)
                      endBatchEdit()
                  }
                  showSuggestions()
              }

              // ---- typing ----
              private fun typeChar(s: String) {
                  currentInputConnection?.commitText(s, 1)
                  if (shift) { shift = false; buildKeys() }
                  showSuggestions()
              }

              private fun backspace() {
                  val ic = currentInputConnection ?: return
                  if (!ic.getSelectedText(0).isNullOrEmpty()) ic.commitText("", 1) else ic.deleteSurroundingText(1, 0)
                  showSuggestions()
              }

              private fun enter() {
                  val ic = currentInputConnection ?: return
                  if (!sendDefaultEditorAction(true)) ic.commitText("\n", 1)
                  showSuggestions()
              }

              // ---- views ----
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun chip(label: String, accent: Boolean, onTap: () -> Unit) = TextView(this).apply {
                  text = label; textSize = 17f
                  setTextColor(if (accent) Color.BLACK else Color.WHITE)
                  setPadding(dp(14), dp(7), dp(14), dp(7))
                  background = GradientDrawable().apply {
                      setColor(if (accent) ACC else KEY); cornerRadius = dp(18).toFloat()
                  }
                  layoutParams = LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply { setMargins(dp(3), 0, dp(3), 0) }
                  setOnClickListener { onTap() }
              }

              private fun key(label: String, weight: Float = 1f, fill: Int = KEY, onTap: () -> Unit) = TextView(this).apply {
                  text = label; textSize = 17f; gravity = Gravity.CENTER
                  setTextColor(Color.WHITE)
                  background = GradientDrawable().apply { setColor(fill); cornerRadius = dp(6).toFloat() }
                  layoutParams = LinearLayout.LayoutParams(0, dp(46), weight).apply { setMargins(dp(2), dp(3), dp(2), dp(3)) }
                  setOnClickListener { it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP); onTap() }
              }

              private fun backspaceKey(): TextView {
                  val k = key("⌫", 1.4f, KEY2) {}
                  val repeat = object : Runnable {
                      override fun run() { backspace(); handler.postDelayed(this, 50) }
                  }
                  k.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { backspace(); handler.postDelayed(repeat, 400) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> handler.removeCallbacks(repeat)
                      }
                      true
                  }
                  return k
              }

              private fun buildKeys() {
                  keyArea.removeAllViews()
                  val layout = if (shift) SHIFT else NORMAL
                  layout.forEachIndexed { i, chars ->
                      val last = i == layout.lastIndex
                      val row = LinearLayout(this)
                      if (last) row.addView(key("⇧", 1.4f, if (shift) ACC else KEY2) { shift = !shift; buildKeys() })
                      for (ch in chars) {
                          val label = if (COMB.containsMatchIn(ch.toString())) "\u25CC$ch" else ch.toString()
                          row.addView(key(label) { typeChar(ch.toString()) })
                      }
                      if (last) row.addView(backspaceKey())
                      keyArea.addView(row)
                  }
                  val bottom = LinearLayout(this)
                  bottom.addView(key("🌐", 1.3f, KEY2) {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showInputMethodPicker()
                  })
                  bottom.addView(key(",") { typeChar(",") })
                  bottom.addView(key("เว้นวรรค", 5f) { typeChar(" ") })
                  bottom.addView(key(".") { typeChar(".") })
                  bottom.addView(key("↵", 1.3f, KEY2) { enter() })
                  keyArea.addView(bottom)
              }
          }
          EOF
          # รายการคำศัพท์ (ดาวน์โหลดตอน build) + คำของคุณเอง เพิ่มบรรทัด echo ได้ไม่จำกัด
          curl -fsSL https://raw.githubusercontent.com/PyThaiNLP/pythainlp/dev/pythainlp/corpus/words_th.txt -o app/src/main/assets/words_th.txt
          echo "" >> app/src/main/assets/words_th.txt
          echo "อุดมราชนิเวศน์มหาสถาน" >> app/src/main/assets/words_th.txt
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Keyboard APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
       
